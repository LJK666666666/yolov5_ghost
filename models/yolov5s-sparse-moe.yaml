# YOLOv5s with Sparse MoE (Mixture of Experts) Architecture
# 基于GUIDE/MOE2.md重新设计的真正稀疏MoE架构
# 
# 核心设计原则：
# 1. 激活率控制在6%-12.5%之间，实现真正的稀疏性
# 2. 大幅增加专家数量(16-32个)，提升模型容量
# 3. 使用top_k=1或2，保持计算效率
# 4. 在关键位置使用MoE，保留标准层的稳定性
#
# Author: Augment Agent (Claude Sonnet 4 by Anthropic)
# Created: 2025-07-05

# Parameters
nc: 80 # number of classes
depth_multiple: 0.33 # model depth multiple
width_multiple: 0.50 # layer channel multiple
anchors:
  - [10, 13, 16, 30, 33, 23] # P3/8
  - [30, 61, 62, 45, 59, 119] # P4/16
  - [116, 90, 156, 198, 373, 326] # P5/32

# YOLOv5 v6.0 backbone with Sparse MoE architecture
backbone:
  # [from, number, module, args]
  [
    [-1, 1, Conv, [64, 6, 2, 2]], # 0-P1/2
    [-1, 1, Conv, [128, 3, 2]], # 1-P2/4 (保持标准卷积)
    [-1, 3, C3, [128]], # 2 (保持标准C3)
    [-1, 1, Conv, [256, 3, 2]], # 3-P3/8 (保持标准卷积)
    [-1, 6, C3MoE, [256, True, 1, 0.5, 16, 1]], # 4 (超稀疏MoE: 16专家激活1个, 激活率6.25%)
    [-1, 1, Conv, [512, 3, 2]], # 5-P4/16 (保持标准卷积)
    [-1, 9, C3MoE, [512, True, 1, 0.5, 24, 1]], # 6 (超稀疏MoE: 24专家激活1个, 激活率4.2%)
    [-1, 1, Conv, [1024, 3, 2]], # 7-P5/32 (保持标准卷积)
    [-1, 3, C3MoE, [1024, True, 1, 0.5, 32, 1]], # 8 (超稀疏MoE: 32专家激活1个, 激活率3.1%)
    [-1, 1, SPPF, [1024, 5]], # 9
  ]

# YOLOv5 v6.0 head with Sparse MoE architecture
head: [
    [-1, 1, Conv, [512, 1, 1]], # 10 (保持标准卷积)
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 11
    [[-1, 6], 1, Concat, [1]], # 12 cat backbone P4
    [-1, 3, C3MoE, [512, False, 1, 0.5, 20, 1]], # 13 (超稀疏MoE特征融合: 20专家激活1个, 激活率5%)

    [-1, 1, Conv, [256, 1, 1]], # 14 (保持标准卷积)
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 15
    [[-1, 4], 1, Concat, [1]], # 16 cat backbone P3
    [-1, 3, C3, [256, False]], # 17 (P3/8-small) (小目标保持标准，确保精度)

    [-1, 1, Conv, [256, 3, 2]], # 18 (保持标准卷积)
    [[-1, 14], 1, Concat, [1]], # 19 cat head P4
    [-1, 3, C3MoE, [512, False, 1, 0.5, 16, 1]], # 20 (P4/16-medium) (超稀疏MoE: 16专家激活1个, 激活率6.25%)

    [-1, 1, Conv, [512, 3, 2]], # 21 (保持标准卷积)
    [[-1, 10], 1, Concat, [1]], # 22 cat head P5
    [-1, 3, C3MoE, [1024, False, 1, 0.5, 24, 1]], # 23 (P5/32-large) (超稀疏MoE: 24专家激活1个, 激活率4.2%)

    [[17, 20, 23], 1, Detect, [nc, anchors]], # Detect(P3, P4, P5)
  ]
