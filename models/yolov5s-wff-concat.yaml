# YOLOv5s with Weighted Feature Fusion Concat (WFF-Concat)
# 创新亮点三：构建"加权"的特征融合颈部网络（通道拼接版本）

# Parameters
nc: 3 # number of classes
depth_multiple: 0.33 # model depth multiple
width_multiple: 0.50 # layer channel multiple
anchors:
  - [10, 13, 16, 30, 33, 23] # P3/8
  - [30, 61, 62, 45, 59, 119] # P4/16
  - [116, 90, 156, 198, 373, 326] # P5/32

# YOLOv5 v6.0 backbone (保持不变)
backbone:
  # [from, number, module, args]
  [
    [-1, 1, Conv, [64, 6, 2, 2]], # 0-P1/2
    [-1, 1, Conv, [128, 3, 2]], # 1-P2/4
    [-1, 3, C3, [128]],
    [-1, 1, Conv, [256, 3, 2]], # 3-P3/8
    [-1, 6, C3, [256]],
    [-1, 1, Conv, [512, 3, 2]], # 5-P4/16
    [-1, 9, C3, [512]],
    [-1, 1, Conv, [1024, 3, 2]], # 7-P5/32
    [-1, 3, C3, [1024]],
    [-1, 1, SPPF, [1024, 5]], # 9
  ]

# YOLOv5 v6.0 head with Weighted Feature Fusion Concat
head: [
    [-1, 1, Conv, [512, 1, 1]], # 10
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 11

    # 🎯 创新点1: 使用加权特征融合拼接替代简单拼接
    # 原始: [[-1, 6], 1, Concat, [1]], # cat backbone P4
    # 新增: 加权后再拼接，保持输出通道数不变
    [[-1, 6], 1, WeightedFeatureFusionConcat, [2]], # 12: 加权融合拼接 P4 + 上采样特征
    [-1, 3, C3, [512, False]], # 13

    [-1, 1, Conv, [256, 1, 1]], # 14
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 15

    # 🎯 创新点2: P3层的加权特征融合拼接
    # 原始: [[-1, 4], 1, Concat, [1]], # cat backbone P3
    [[-1, 4], 1, WeightedFeatureFusionConcat, [2]], # 16: 加权融合拼接 P3 + 上采样特征 (P3/8-small)
    [-1, 3, C3, [256, False]], # 17

    [-1, 1, Conv, [256, 3, 2]], # 18

    # 🎯 创新点3: P4层的加权特征融合拼接
    # 原始: [[-1, 14], 1, Concat, [1]], # cat head P4
    [[-1, 13], 1, WeightedFeatureFusionConcat, [2]], # 19: 加权融合拼接下采样特征 + P4特征 (P4/16-medium)
    [-1, 3, C3, [512, False]], # 20

    [-1, 1, Conv, [512, 3, 2]], # 21

    # 🎯 创新点4: P5层的加权特征融合拼接
    # 原始: [[-1, 10], 1, Concat, [1]], # cat head P5
    [[-1, 10], 1, WeightedFeatureFusionConcat, [2]], # 22: 加权融合拼接下采样特征 + P5特征 (P5/32-large)
    [-1, 3, C3, [1024, False]], # 23

    [[17, 20, 23], 1, Detect, [nc, anchors]], # Detect(P3, P4, P5)
  ]
# === 创新说明 ===
#
# 这个版本使用 WeightedFeatureFusionConcat，在加权后进行通道拼接，
# 保持与原始YOLOv5完全相同的网络结构和通道数，只是在特征融合时
# 增加了可学习的权重机制。
#
# 优势：
# 1. 完全兼容原始YOLOv5的网络结构
# 2. 可以直接使用预训练权重进行初始化
# 3. 参数增加量极小（每个融合点只增加2个权重参数）
# 4. 训练稳定性更好
#
# 项目故事："我们发现，标准的YOLOv5在进行特征融合时，对所有尺度的特征图一视同仁。
# 我们认为，对于反光衣检测这类任务，某些特定尺度的特征可能更为关键。因此，我们借鉴了
# BiFPN（加权双向特征金字塔网络）的核心思想，引入了一个高效的加权融合机制。该机制让
# 网络在训练中自主学习每个输入特征的权重，然后进行加权拼接，从而实现更智能、更高效的
# 特征融合，同时保持与原始网络结构的完全兼容性。"
