# YOLOv5s with Weighted Feature Fusion (WFF)
# 创新亮点三：构建"加权"的特征融合颈部网络

# Parameters
nc: 3 # number of classes
depth_multiple: 0.33 # model depth multiple
width_multiple: 0.50 # layer channel multiple
anchors:
  - [10, 13, 16, 30, 33, 23] # P3/8
  - [30, 61, 62, 45, 59, 119] # P4/16
  - [116, 90, 156, 198, 373, 326] # P5/32

# YOLOv5 v6.0 backbone (保持不变)
backbone:
  # [from, number, module, args]
  [
    [-1, 1, Conv, [64, 6, 2, 2]], # 0-P1/2
    [-1, 1, Conv, [128, 3, 2]], # 1-P2/4
    [-1, 3, C3, [128]],
    [-1, 1, Conv, [256, 3, 2]], # 3-P3/8
    [-1, 6, C3, [256]],
    [-1, 1, Conv, [512, 3, 2]], # 5-P4/16
    [-1, 9, C3, [512]],
    [-1, 1, Conv, [1024, 3, 2]], # 7-P5/32
    [-1, 3, C3, [1024]],
    [-1, 1, SPPF, [1024, 5]], # 9
  ]

# YOLOv5 v6.0 head with Weighted Feature Fusion
head: [
    [-1, 1, Conv, [512, 1, 1]], # 10
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 11

    # 🎯 创新点1: 使用加权特征融合替代简单拼接
    # 原始: [[-1, 6], 1, Concat, [1]], # cat backbone P4 (512+256=768)
    # 新增: 统一通道数后进行加权融合
    [6, 1, Conv, [512, 1, 1]], # 12: 将P4特征图从256调整为512通道
    [[-1, 11], 1, WeightedFeatureFusion, [2]], # 13: 加权融合 P4(512) + 上采样特征(512)
    [-1, 3, C3, [512, False]], # 14

    [-1, 1, Conv, [256, 1, 1]], # 15
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 16

    # 🎯 创新点2: P3层的加权特征融合
    # 原始: [[-1, 4], 1, Concat, [1]], # cat backbone P3 (256+128=384)
    # 新增: 统一通道数后进行加权融合
    [4, 1, Conv, [256, 1, 1]], # 17: 将P3特征图从128调整为256通道
    [[-1, 16], 1, WeightedFeatureFusion, [2]], # 18: 加权融合 P3(256) + 上采样特征(256)
    [-1, 3, C3, [256, False]], # 19 (P3/8-small)

    [-1, 1, Conv, [256, 3, 2]], # 20

    # 🎯 创新点3: P4层的加权特征融合
    # 原始: [[-1, 14], 1, Concat, [1]], # cat head P4 (256+512=768)
    # 新增: 统一通道数后进行加权融合
    [-1, 1, Conv, [512, 1, 1]], # 21: 将下采样特征从256调整为512通道
    [[-1, 14], 1, WeightedFeatureFusion, [2]], # 22: 加权融合下采样特征(512) + P4特征(512)
    [-1, 3, C3, [512, False]], # 23 (P4/16-medium)

    [-1, 1, Conv, [512, 3, 2]], # 24

    # 🎯 创新点4: P5层的加权特征融合
    # 原始: [[-1, 10], 1, Concat, [1]], # cat head P5 (512+512=1024)
    [[-1, 10], 1, WeightedFeatureFusion, [2]], # 25: 加权融合下采样特征(512) + P5特征(512)
    [-1, 3, C3, [1024, False]], # 26 (P5/32-large)

    [[19, 23, 26], 1, Detect, [nc, anchors]], # Detect(P3, P4, P5)
  ]

# === 创新说明 ===
# 
# 项目故事："我们发现，标准的YOLOv5在进行特征融合时，对所有尺度的特征图一视同仁。
# 我们认为，对于反光衣检测这类任务，某些特定尺度的特征可能更为关键。因此，我们借鉴了
# BiFPN（加权双向特征金字塔网络）的核心思想，引入了一个高效的加权融合机制。该机制让
# 网络在训练中自主学习每个输入特征的权重，从而实现更智能、更高效的特征融合。"
#
# 主要改动：
# 1. 将所有 Concat 层替换为 WeightedFeatureFusion 层
# 2. 添加必要的 1x1 卷积来统一通道数（如果需要）
# 3. 保持网络的整体结构和参数量基本不变
# 4. 让网络自主学习不同特征图的重要性权重
#
# 预期效果：
# - 提升特征融合的效率和准确性
# - 让网络更好地关注重要的特征尺度
# - 在复杂场景下提升检测性能
# - 参数增加量很小（每个融合点只增加2-4个权重参数）
